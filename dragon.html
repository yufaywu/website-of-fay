<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>
        How to Train Your Dragon | Fay's Movie Diary
    </title>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <header>
        <h1>
            FAY'S MOVIE DIARY
        </h1>
        <p>
            Movies I've watched 🎬
        </p>
    </header>

    <main>
        <section class="movie-detail">
            <img
                src="images/dragon.jpg"
                alt="How to Train Your Dragon"
                class="detail-poster"
            >

            <div class="detail-info">
                <p class="detail-label">
                    MOVIE REVIEW
                </p>

                <h2>
                    How to Train Your Dragon
                </h2>

                <p
                    class="detail-rating"
                    data-rating="4"
                ></p>

                <p class="detail-meta">
                    Fantasy · Adventure
                </p>

                <h3>
                    MY THOUGHTS
                </h3>

                <p class="detail-thoughts">
                    跟動畫內容一樣，畫面非常逼真。
                </p>

            </div>
        </section>

        <a
            href="movies.html"
            class="back-button"
        >
            ← BACK TO MOVIES
        </a>

    </main>


    <footer>
        <p>
            Made by Fay · 2026
        </p>

    </footer>
    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fay's Movie Diary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>FAY'S MOVIE DIARY</h1>
        <p>Movies I've watched 🎬</p>
    </header>

    <main>

        <section class="movies">
            <h2>MY MOVIES</h2>

            <div class="movie-grid">

                <!-- Spider-Man -->
                <div class="movie-card">
                    <img src="images/spiderman.jpg" alt="蜘蛛人：重生日">
                    <div class="movie-info">
                        <h3>蜘蛛人：重生日</h3>
                        <p>SPIDER-MAN</p>
                        <p class="rating">★★★★★</p>
                    </div>
                </div>

                <!-- How to Train Your Dragon -->
                <div class="movie-card">
                    <img src="images/dragon.jpg" alt="馴龍高手">
                    <div class="movie-info">
                        <h3>馴龍高手</h3>
                        <p>HOW TO TRAIN YOUR DRAGON</p>
                        <p class="rating">★★★★★</p>
                    </div>
                </div>

                <!-- F1 -->
                <div class="movie-card">
                    <img src="images/f1.jpg" alt="F1電影">
                    <div class="movie-info">
                        <h3>F1電影</h3>
                        <p>F1 THE MOVIE</p>
                        <p class="rating">★★★★★</p>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>Made by Fay · 2026</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fay's Movie Diary</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <header>
        <h1>FAY'S MOVIE DIARY</h1>
        <p>Movies I've watched 🎬</p>
    </header>

    <main>
        <section class="movies">
            <h2>MY MOVIES</h2>
            <div class="movie-grid">

                <!-- Spider-Man -->
                <a href="spiderman.html" class="movie-card">
                    <img src="images/spiderman.jpg" alt="Spider-Man: Brand New Day" >
                    <div class="movie-info">
                        <h3>蜘蛛人：重生日</h3>
                        <p>SPIDER-MAN: BRAND NEW DAY</p>
                        <p class="rating">★★★★½</p>
                    </div>
                </a>
                
                <!-- How to Train Your Dragon -->
                <a href="dragon.html" class="movie-card">
                    <img src="images/dragon.jpg" alt="How to Train Your Dragon" >
                    <div class="movie-info">
                        <h3>馴龍高手</h3>
                        <p>HOW TO TRAIN YOUR DRAGON</p>
                        <p class="rating">★★★★☆</p>
                    </div>
                </a>
                
                <!-- F1 -->
                <a href="f1.html" class="movie-card">
                    <img src="images/f1.jpg" alt="F1 The Movie" >
                    <div class="movie-info">
                        <h3>F1電影</h3>
                        <p>F1 THE MOVIE</p>
                        <p class="rating">★★★★½</p>
                    </div>
                </a>

                <!-- Toy Story 5 -->
                <a href="toy-story-5.html" class="movie-card">
                    <img src="images/toy-story-5.jpg" alt="Toy Story 5" >
                    <div class="movie-info">
                        <h3> 玩具總動員5 </h3>
                        <p> TOY STORY 5 </p>
                        <p class="rating"> ★★★★☆ </p>
                    </div>
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>Made by Fay · 2026</p>
    </footer>
</body>
</html>
